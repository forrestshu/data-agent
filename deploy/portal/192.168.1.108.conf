server
{
    listen 80;
    server_name 192.168.1.108;
    root /opt/app/portal;
    index index.html;

    include /www/server/panel/vhost/nginx/well-known/192.168.1.108.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/\. {
        deny all;
    }

    access_log /www/wwwlogs/192.168.1.108.log;
    error_log /www/wwwlogs/192.168.1.108.error.log;
}
