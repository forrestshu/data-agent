[project]
name = "data-agent"
version = "0.1.0"
description = "自然语言查询与 SQLite 只读代理"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.12.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
data-agent = "data_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]
